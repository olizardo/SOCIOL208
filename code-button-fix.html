<script>
document.addEventListener("DOMContentLoaded", function() {
  const showAllCode = document.getElementById("quarto-show-all-code");
  const hideAllCode = document.getElementById("quarto-hide-all-code");
  
  if (showAllCode) {
    showAllCode.addEventListener("click", function() {
      // Open all details elements in cells
      document.querySelectorAll(".cell details").forEach(el => {
        el.open = true;
      });
      // Toggle hidden/unhidden on all code blocks in cells
      document.querySelectorAll(".cell .sourceCode").forEach(div => {
        if (div.classList.contains("hidden")) {
          div.classList.remove("hidden");
          div.classList.add("unhidden");
        }
      });
    });
  }
  
  if (hideAllCode) {
    hideAllCode.addEventListener("click", function() {
      // Close all details elements in cells
      document.querySelectorAll(".cell details").forEach(el => {
        el.removeAttribute("open");
      });
      // Toggle hidden/unhidden on all code blocks in cells
      document.querySelectorAll(".cell .sourceCode").forEach(div => {
        if (div.classList.contains("unhidden")) {
          div.classList.remove("unhidden");
          div.classList.add("hidden");
        }
      });
    });
  }
});
</script>
